# The agent review, second gate of a merge (AGENTS.md, "Merging"): Claude reviews the pull request's diff with the
# code-review plugin and leaves inline comments. The official example (code.claude.com/docs/en/github-actions, "Run a
# skill", retrieved 2026-11-05), plus a skip: with no CLAUDE_CODE_OAUTH_TOKEN secret (not added yet, or a pull request
# from a fork, which GitHub runs without secrets) the job passes with a notice instead of failing.
name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # a new push replaces the review of the old one
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "set=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret, so no agent review: run /code-review high in a fresh session (AGENTS.md, Merging)"; fi
      - if: steps.token.outputs.set == '1'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - if: steps.token.outputs.set == '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
