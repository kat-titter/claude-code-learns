<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" role="img" aria-label="check-repair.js: each unit is built by an agent and checked by its exit code; a failing unit is repaired alone, up to three rounds; a repair that passes becomes a candidate rule, and a unit still failing comes to you.">
