<svg xmlns="http://www.w3.org/2000/svg" width="320" height="672" viewBox="0 0 320 672" role="img" aria-label="check-repair.js, phone layout: an agent builds each unit, a check reads its exit code, a failing unit is repaired alone up to three rounds, a unit still failing comes to you, and a repair that passes becomes a candidate rule.">
<title>check-repair.js, phone layout: an agent builds each unit, a check reads its exit code, a failing unit is repaired alone up to three rounds, a unit still failing comes to you, and a repair that passes becomes a candidate rule.</title>
