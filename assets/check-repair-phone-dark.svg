<text x="45" y="648" font-family="Archivo,-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#b0aea5" text-anchor="start">Claude</text>
<rect x="106" y="636" width="14" height="14" rx="3" fill="#282e22" stroke="#788c5d" stroke-width="1.5"/>
<text x="127" y="648" font-family="Archivo,-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#b0aea5" text-anchor="start">what it keeps</text>
