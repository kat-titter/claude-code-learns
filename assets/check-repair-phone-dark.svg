<rect x="0.5" y="0.5" width="319" height="671" rx="16" fill="#1f1e1d" stroke="#3d3d3a"/>
<text x="40" y="34" font-family="'IBM Plex Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#b0aea5" text-anchor="start" letter-spacing="1.2">EACH UNIT, IN PARALLEL</text>
